<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud ERP 进销存</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=BUILD_VERSION" />
  <link rel="apple-touch-icon" href="/logo.svg?v=BUILD_VERSION" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="app-template">
    <!-- 启动加载页：会话检查期间显示，避免刷新时闪登录框 -->
    <div v-if="!authReady" class="boot-screen">
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--primary);margin-bottom:10px">{{ company.app_title || 'Cloud ERP 进销存' }}</div>
        <div style="font-size:13px;color:var(--muted)">正在加载数据…</div>
      </div>
    </div>

    <!-- 登录页 -->
    <div v-else-if="!loggedIn" class="login-wrap">
      <div class="login-box">
        <img src="/logo.svg?v=BUILD_VERSION" alt="logo" class="login-logo" />
        <h1>{{ company.app_title || 'Cloud ERP 进销存' }}</h1>
        <p>{{ company.company_name || '企业进销存管理系统' }} · 进销存 · 资金 · 报表</p>
        <form @submit.prevent="login">
          <div class="form-row">
            <label style="display:block; text-align:center">登录账号</label>
            <input v-model="loginUser" style="text-align:center" autofocus />
          </div>
          <div class="form-row">
            <label style="display:block; text-align:center">登录密码</label>
            <input type="password" v-model="loginPwd" style="text-align:center" />
          </div>
          <div v-if="loginErr" class="text-danger" style="margin-bottom:10px; text-align:center">{{ loginErr }}</div>
          <button class="btn-primary" style="width:100%" type="submit">登 录</button>
        </form>
      </div>
    </div>

    <!-- 主界面 -->
    <div v-else class="layout">
      <aside class="sidebar">
        <div class="logo">
          <img src="/logo.svg?v=BUILD_VERSION" alt="logo" class="logo-img" />
          <span>{{ company.app_title || 'Cloud ERP' }}</span>
          <small>{{ company.company_name || '进销存管理系统' }}</small>
        </div>
        <nav class="nav">
          <a v-for="n in nav" :key="n.key" v-show="navVisible(n)" :class="{ active: view === n.key }" @click="go(n.key)">
            <span class="icon">{{ n.icon }}</span>
            <span>{{ n.label }}</span>
            <span v-if="n.key === 'settings' && currentUser?.role === 'admin'" class="badge blue" style="margin-left:6px;font-size:10px">管理</span>
          </a>
        </nav>
        <div class="side-foot">
          <div style="margin-bottom:8px;font-size:12px;color:var(--muted)">
            👤 {{ currentUser?.name || currentUser?.username || '用户' }}
            <span class="badge" :class="currentUser?.role === 'admin' ? 'blue' : currentUser?.role === 'sales' ? 'green' : 'gray'" style="margin-left:4px">{{ roleLabel(currentUser?.role) }}</span>
          </div>
          <button @click="logout">退出登录</button>
        </div>
      </aside>

      <main class="main">
        <!-- ===== 概览 ===== -->
        <template v-if="view === 'dashboard'">
          <div class="page-header">
            <div class="page-title">数据看板概览</div>
            <div class="toolbar" style="margin:0">
              <input type="date" v-model="dashFrom" @change="loadDashboard" style="width:140px" />
              <span class="text-muted">至</span>
              <input type="date" v-model="dashTo" @change="loadDashboard" style="width:140px" />
              <button class="btn-sm" @click="setDashRange('today')">今日</button>
              <button class="btn-sm" @click="setDashRange('7d')">近7天</button>
              <button class="btn-sm btn-primary" @click="setDashRange('month')">本月</button>
            </div>
          </div>
          <template v-if="dash">
            <div class="grid-cards">
              <div class="stat-card blue">
                <div class="stat-header"><span class="stat-label">销售总额</span><span class="stat-tag">已扣优惠</span></div>
                <div class="stat-value blue">{{ money(dash.sales.revenue) }}</div>
                <div class="stat-sub">本期共 {{ dash.sales.orders }} 笔销售单</div>
              </div>
              <div class="stat-card green">
                <div class="stat-header"><span class="stat-label">商品毛利（净）</span><span class="stat-tag" style="background:#ecfdf5;color:#059669">核心利润</span></div>
                <div class="stat-value green">{{ money(dash.sales.profit) }}</div>
                <div class="stat-sub">销售毛利率 {{ dash.sales.revenue ? ((dash.sales.profit / dash.sales.revenue) * 100).toFixed(1) + '%' : '—' }}</div>
              </div>
              <div class="stat-card amber">
                <div class="stat-header"><span class="stat-label">采购进货支出</span><span class="stat-tag">{{ dash.purchases.orders }} 单</span></div>
                <div class="stat-value">{{ money(dash.purchases.total) }}</div>
                <div class="stat-sub">包含退货冲抵后金额</div>
              </div>
              <div class="stat-card purple">
                <div class="stat-header">
                  <span class="stat-label">经营利润汇总 · 本期</span>
                  <span style="display:flex; align-items:center; gap:6px">
                    <span class="stat-tag">毛利合计</span>
                    <button type="button" @click="toggleBalance" :title="hideBalance ? '点击显示金额' : '点击隐藏金额'" style="background:none; border:none; cursor:pointer; padding:0 2px; font-size:14px; line-height:1; color:inherit; opacity:.65">{{ hideBalance ? '👁' : '🙈' }}</button>
                  </span>
                </div>
                <div class="stat-value purple">{{ hideBalance ? '¥ ＊＊＊＊＊' : money((dash.sales?.profit || 0) + (dash.repair?.profit || 0) + (dash.money?.otherNet || 0)) }}</div>
                <div v-if="!hideBalance" class="stat-sub">商品毛利 {{ money(dash.sales?.profit || 0) }} · 维修毛利 {{ money(dash.repair?.profit || 0) }} · 其他收支净额 {{ money(dash.money?.otherNet || 0) }}</div>
              </div>
            </div>

            <div class="grid-cards">
              <div class="stat-card">
                <div class="stat-header"><span class="stat-label">客户欠款（应收账款）</span><span class="stat-tag">资产</span></div>
                <div class="stat-value" :class="dash.money.customerDebt > 0 ? 'danger' : ''">{{ money(dash.money.customerDebt) }}</div>
                <div class="stat-sub">客户未付清货款总计</div>
              </div>
              <div class="stat-card">
                <div class="stat-header"><span class="stat-label">供应商欠款（应付账款）</span><span class="stat-tag">负债</span></div>
                <div class="stat-value" :class="dash.money.supplierDebt > 0 ? 'danger' : ''">{{ money(dash.money.supplierDebt) }}</div>
                <div class="stat-sub">应付供应商采购货款</div>
              </div>
              <div class="stat-card">
                <div class="stat-header"><span class="stat-label">其他收支净额</span><span class="stat-tag">非单据</span></div>
                <div class="stat-value" :class="dash.money.otherNet >= 0 ? 'blue' : 'danger'">{{ money(dash.money.otherNet) }}</div>
                <div class="stat-sub">文印照相等收入 − 日常开支</div>
              </div>
              <div class="stat-card">
                <div class="stat-header"><span class="stat-label">在册档案总数</span><span class="stat-tag">基础</span></div>
                <div class="stat-value">{{ dash.counts.products }} <small style="font-size:13px;font-weight:400;color:var(--muted)">品</small></div>
                <div class="stat-sub">{{ dash.counts.parties }} 家往来合作单位</div>
              </div>
            </div>

            <div class="card">
              <h3>⚡ 低库存智能预警</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>商品名称</th><th class="num">当前可用库存</th><th class="num">最低预警阈值</th><th>单位</th><th class="num">操作</th></tr></thead>
                  <tbody>
                    <tr v-for="p in dash.lowStock" :key="p.id">
                      <td><strong>{{ p.name }}</strong></td>
                      <td class="num"><span class="badge red">{{ qfmt(p.stock) }}</span></td>
                      <td class="num text-muted">{{ qfmt(p.low_stock) }}</td>
                      <td>{{ p.unit }}</td>
                      <td class="num"><button class="btn-sm btn-primary" @click="go('purchase')">去采购</button></td>
                    </tr>
                  </tbody>
                </table>
                <div v-if="!dash.lowStock.length" class="empty">库存健康，暂无低于预警线的商品 👏</div>
              </div>
            </div>

            <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px">
              <div class="card" style="margin-bottom:0">
                <h3>🛍️ 最近销售动态</h3>
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>时间</th><th>客户</th><th class="num">实收金额</th></tr></thead>
                    <tbody>
                      <tr v-for="s in dash.recentSales" :key="s.id">
                        <td class="text-muted">{{ dt(s.created_at) }}</td>
                        <td>{{ s.customer_name || '散客' }} <span v-if="s.kind === 'return'" class="badge gray">退货</span></td>
                        <td class="num"><strong>{{ money(s.kind === 'return' ? -(s.total - s.discount) : s.total - s.discount) }}</strong></td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-if="!dash.recentSales.length" class="empty">暂无销售动态</div>
                </div>
              </div>
              <div class="card" style="margin-bottom:0">
                <h3>📦 最近采购入库</h3>
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>时间</th><th>供应商</th><th class="num">进货金额</th></tr></thead>
                    <tbody>
                      <tr v-for="pu in dash.recentPurchases" :key="pu.id">
                        <td class="text-muted">{{ dt(pu.created_at) }}</td>
                        <td>{{ pu.supplier_name || '—' }} <span v-if="pu.kind === 'return'" class="badge gray">退货</span></td>
                        <td class="num"><strong>{{ money(pu.kind === 'return' ? -(pu.total - pu.discount) : pu.total - pu.discount) }}</strong></td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-if="!dash.recentPurchases.length" class="empty">暂无采购动态</div>
                </div>
              </div>
            </div>
          </template>
        </template>

        <!-- ===== 商品管理 ===== -->
        <template v-else-if="view === 'products'">
          <div class="page-title">商品管理</div>
          <div class="card">
            <div class="toolbar">
              <input v-model="prodSearch" placeholder="搜索名称 / 编号 / 条码" style="width:220px" />
              <button type="button" class="btn-sm" title="手机扫码查找商品" @click="scanToSearch">📷</button>
              <select v-model="prodCategory" style="width:140px">
                <option value="">全部类别</option>
                <option v-for="cst in categories" :key="cst" :value="cst">{{ cst }}</option>
              </select>
              <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted)">
                <input type="checkbox" v-model="showArchived" style="width:auto" /> 显示已停用
              </label>
              <div style="flex:1"></div>
              <button class="btn-sm btn-danger" :disabled="cleaningDup" @click="cleanupDuplicates">{{ cleaningDup ? '清理中...' : '清理重复零库存商品' }}</button>
              <button class="btn-primary" @click="openProdModal(null)">＋ 新增商品</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>名称</th><th>编号</th><th>条码</th><th>类别</th><th>单位</th><th class="num">库存</th><th class="num">成本均价</th><th class="num">售价</th><th class="num">低库存阈值</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                  <tr v-for="p in filteredProducts" :key="p.id">
                    <td>{{ p.name }}</td>
                    <td class="text-muted">{{ p.sku || '—' }}</td>
                    <td class="text-muted">{{ p.barcode || '—' }}</td>
                    <td class="text-muted">{{ p.category || '—' }}</td>
                    <td>{{ p.unit }}</td>
                    <td class="num">
                      <span v-if="p.no_stock" class="badge blue">服务</span>
                      <span v-else :class="{ 'text-danger': p.low_stock > 0 && p.stock <= p.low_stock }">{{ qfmt(p.stock) }}</span>
                    </td>
                    <td class="num">{{ money(p.avg_cost) }}<span v-if="p.cost_manual" class="badge gray" style="margin-left:4px">手定</span></td>
                    <td class="num">{{ money(p.sale_price) }}</td>
                    <td class="num text-muted">{{ p.no_stock ? '—' : qfmt(p.low_stock) }}</td>
                    <td><span class="badge" :class="p.archived ? 'gray' : 'green'">{{ p.archived ? '已停用' : '正常' }}</span></td>
                    <td>
                      <button v-if="!p.no_stock" class="btn-sm" @click="openAdjust(p)">调整</button>
                      <button class="btn-sm" @click="openProdModal(p)">编辑</button>
                      <button class="btn-sm btn-danger" @click="delProduct(p)">删除</button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div v-if="!filteredProducts.length" class="empty">暂无商品，点右上角新增</div>
            </div>
          </div>
        </template>

        <!-- ===== 采购入库 ===== -->
        <template v-else-if="view === 'purchase'">
          <div class="page-title">采购入库</div>
          <div class="card">
            <h3>新建采购单</h3>
            <div class="form-grid" style="margin-bottom:12px">
              <div>
                <label>供应商</label>
                <select v-model="purchaseForm.supplier_id">
                  <option value="">— 手动输入 —</option>
                  <option v-for="s in suppliers" :key="s.id" :value="s.id">{{ s.name }}{{ debtLabel(s) ? '（' + debtLabel(s) + '）' : '' }}</option>
                </select>
              </div>
              <div v-if="!purchaseForm.supplier_id">
                <label>供应商名称（手动）</label>
                <input v-model="purchaseForm.name_free" placeholder="可留空" />
              </div>
              <div>
                <label>结算账户（本次付款用）</label>
                <select v-model="purchaseForm.account_id">
                  <option value="">— 未设置 —</option>
                  <option v-for="a in accounts" :key="a.id" :value="a.id">{{ a.name }}（{{ money(a.balance) }}）</option>
                </select>
              </div>
              <div>
                <label>单据日期（可选，默认现在）</label>
                <input type="date" v-model="purchaseForm.date" />
              </div>
              <div>
                <label>备注</label>
                <input v-model="purchaseForm.note" placeholder="单号、运费等，可留空" />
              </div>
            </div>
            <div class="table-wrap">
              <table class="items-edit">
                <thead><tr><th style="min-width:200px">商品</th><th>数量</th><th>单价（进货成本）</th><th class="num">小计</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="(it, i) in purchaseForm.items" :key="i">
                    <td style="min-width:230px">
                      <product-picker v-model="it.product_id" :products="purchasableProducts" mode="purchase" @update:model-value="onProductChange(purchaseForm, it, $event)" />
                    </td>
                    <td><input type="number" min="0" step="any" v-model.number="it.qty" style="width:95px" /></td>
                    <td><input type="number" min="0" step="0.01" v-model.number="it.price" style="width:115px" /></td>
                    <td class="num">{{ money(it.qty * it.price) }}</td>
                    <td><button class="del-row" @click="delRow(purchaseForm, i)">×</button></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="form-grid" style="margin:12px 0">
              <div><label>整单优惠金额</label><input type="number" min="0" step="0.01" v-model.number="purchaseForm.discount" /></div>
              <div><label>本次付款</label><input type="number" min="0" step="0.01" v-model.number="purchaseForm.paid" /></div>
            </div>
            <div class="total-line">
              <span class="text-muted">合计 {{ money(purchaseTotal) }}</span>
              <span class="text-muted">应付 {{ money(purchaseNet) }}</span>
              <strong :class="purchaseNet - Number(purchaseForm.paid || 0) > 0 ? 'text-danger' : ''">欠款 {{ money(purchaseNet - Number(purchaseForm.paid || 0)) }}</strong>
              <button @click="addRow(purchaseForm)">＋ 加一行</button>
              <button @click="addNewProduct('purchaseForm')">＋ 新商品</button>
              <button class="btn-primary" :disabled="submitting" @click="submitOrder('purchase')">提交入库</button>
            </div>
          </div>

          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px">
              <h3 style="margin:0">采购记录</h3>
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
                <input type="date" v-model="ordFrom" style="width:145px" @change="ordFilterChanged" />
                <span class="text-muted">至</span>
                <input type="date" v-model="ordTo" style="width:145px" @change="ordFilterChanged" />
                <button type="button" class="btn-sm" @click="setOrdRange('month')">本月</button>
                <button type="button" class="btn-sm" @click="setOrdRange('prev')">上月</button>
                <button type="button" class="btn-sm" @click="setOrdRange('all')">全部</button>
                <span class="text-muted" style="font-size:12px">共 {{ purchases.length }} 单</span>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>时间</th><th>供应商</th><th class="num">金额</th><th class="num">已付</th><th class="num">欠款</th><th class="num">明细数</th><th>备注</th><th>操作</th></tr></thead>
                <tbody>
                  <tr v-for="pu in purchases" :key="pu.id">
                    <td>{{ dt(pu.created_at) }}</td>
                    <td>{{ pu.supplier_name || '—' }} <span v-if="pu.kind === 'return'" class="badge gray">退货</span></td>
                    <td class="num" :class="pu.kind === 'return' ? 'text-green' : ''">{{ money(pu.kind === 'return' ? -(pu.total - pu.discount) : pu.total - pu.discount) }}</td>
                    <td class="num">{{ money(pu.paid) }}</td>
                    <td class="num" :class="pu.kind === 'normal' && pu.total - pu.discount - pu.paid > 0 ? 'text-danger' : ''">{{ money(pu.kind === 'normal' ? pu.total - pu.discount - pu.paid : 0) }}</td>
                    <td class="num">{{ pu.item_count }}</td>
                    <td class="text-muted">{{ pu.note || '' }}</td>
                    <td>
                      <button class="btn-sm" @click="viewOrder('purchase', pu.id)">查看</button>
                      <button v-if="pu.kind === 'normal'" class="btn-sm" @click="openOrderEdit('purchases', pu.id)">修改</button>
                      <button v-if="pu.kind === 'normal'" class="btn-sm" @click="openReturn('purchases', pu.id)">退货</button>
                      <button class="btn-sm btn-danger" @click="delOrder('purchase', pu.id)">删除</button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div v-if="!purchases.length" class="empty">暂无采购记录</div>
            </div>
          </div>
        </template>

        <!-- ===== 销售出库 ===== -->
        <template v-else-if="view === 'sales'">
          <div class="page-title">销售出库</div>
          <div class="card">
            <h3>新建销售单</h3>
            <div class="form-grid" style="margin-bottom:12px">
              <div>
                <label>客户</label>
                <select v-model="saleForm.customer_id">
                  <option value="">— 手动输入 —</option>
                  <option v-for="s in customers" :key="s.id" :value="s.id">{{ s.name }}{{ debtLabel(s) ? '（' + debtLabel(s) + '）' : '' }}</option>
                </select>
              </div>
              <div v-if="!saleForm.customer_id">
                <label>客户名称（手动）</label>
                <input v-model="saleForm.name_free" placeholder="可留空" />
              </div>
              <div>
                <label>结算账户（本次收款用）</label>
                <select v-model="saleForm.account_id">
                  <option value="">— 未设置 —</option>
                  <option v-for="a in accounts" :key="a.id" :value="a.id">{{ a.name }}（{{ money(a.balance) }}）</option>
                </select>
              </div>
              <div>
                <label>单据日期（可选，默认现在）</label>
                <input type="date" v-model="saleForm.date" />
              </div>
              <div>
                <label>备注</label>
                <input v-model="saleForm.note" placeholder="可留空" />
              </div>
            </div>
            <div class="table-wrap">
              <table class="items-edit">
                <thead><tr><th style="min-width:200px">商品</th><th>数量</th><th>单价（售价）</th><th v-show="saleShowCost">成本 <button type="button" class="btn-sm" style="padding:1px 6px;font-size:11px" :title="saleShowCost ? '点击隐藏成本' : '点击查看成本'" @click.prevent="saleShowCost = !saleShowCost">{{ saleShowCost ? '隐藏' : '查看' }}</button></th><th class="num">小计</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="(it, i) in saleForm.items" :key="i">
                    <td style="min-width:230px">
                      <div v-if="it.manual" style="display:flex; align-items:center; gap:6px">
                        <input v-model="it.name" placeholder="手填项名称（不入库商品/服务）" style="flex:1" />
                        <span class="badge gray" style="flex-shrink:0">手填</span>
                      </div>
                      <product-picker v-else v-model="it.product_id" :products="activeProducts" mode="sale" @update:model-value="onProductChange(saleForm, it, $event)" />
                    </td>
                    <td><input type="number" min="0" step="any" v-model.number="it.qty" style="width:85px" /></td>

            <label>类型</label>
            <select v-model="fundsForm.type">
              <option value="income">其他收入</option>
              <option value="expense">其他支出</option>
              <option value="receipt">收款</option>
              <option value="payment">付款</option>
            </select>
          </div>
          <div class="form-row" v-if="fundsForm.type === 'receipt' || fundsForm.type === 'payment' || fundsForm.type === 'income' || fundsForm.type === 'expense'">
            <label>{{ fundPartyLabel(fundsForm.type) }}</label>
            <select v-model="fundsForm.party_id">
              <option value="">{{ fundsForm.type === 'receipt' || fundsForm.type === 'payment' ? '选择往来单位' : '— 不关联 —' }}</option>
              <option v-for="p in fundPartyList(fundsForm.type)" :key="p.id" :value="p.id">
                {{ p.name }}{{ debtLabel(p) ? '（' + debtLabel(p) + '）' : '' }}
              </option>
            </select>
          </div>
          <div class="form-row">
            <label>结算账户 *</label>
            <select v-model="fundsForm.account_id">
              <option v-for="a in accounts" :key="a.id" :value="a.id">{{ a.name }}（{{ money(a.balance) }}）</option>
            </select>
          </div>
          <div class="form-row">
            <label>金额 *</label>
            <input type="number" min="0" step="0.01" v-model.number="fundsForm.amount" />
          </div>
          <div class="form-row">
            <label>入账日期（可选）</label>
            <input type="date" v-model="fundsForm.date" />
          </div>
          <div class="form-row">
            <label>备注</label>
            <input v-model="fundsForm.note" />
          </div>
          <div class="modal-foot">
            <button class="btn-danger" @click="delFundsRow">删除</button>
            <button @click="fundsDetail = null">取消</button>
            <button class="btn-primary" @click="saveFundsRow">保存</button>
          </div>
        </template>
        <template v-else>
          <h3>{{ fundLabel(fundsDetail.type) }} · {{ money(fundsDetail.amount) }}</h3>
          <table style="width:100%; margin-bottom:6px">
            <tbody>
              <tr><td class="text-muted" style="width:80px">时间</td><td>{{ dt(fundsDetail.created_at) }}</td></tr>
              <tr><td class="text-muted">往来单位</td><td>{{ fundsDetail.party_name || '—' }}</td></tr>
              <tr><td class="text-muted">结算账户</td><td>{{ fundsDetail.account_name || '—' }}</td></tr>
              <tr><td class="text-muted">备注</td><td>{{ fundsDetail.note || '—' }}</td></tr>
            </tbody>
          </table>
          <p class="text-muted" style="font-size:12px">此流水随单据产生，不能单独修改；如需调整请删除或修改对应单据。</p>
          <div class="modal-foot"><button @click="fundsDetail = null">关闭</button></div>
        </template>
      </div>
    </div>

    <!-- 单据修改弹窗（采购/销售） -->
    <div class="modal-mask" v-if="orderEdit" @click.self="orderEdit = null">
      <div class="modal" style="max-width:760px">
        <h3>修改{{ orderEdit.kind === 'sales' ? '销售单' : '采购单' }} #{{ orderEdit.id }}</h3>
        <div class="form-grid" style="margin-bottom:12px">
          <div>
            <label>{{ orderEdit.kind === 'sales' ? '客户' : '供应商' }}</label>
            <select v-model="orderEdit.party_id">
              <option value="">— 手动输入 —</option>
              <option v-for="p in (orderEdit.kind === 'sales' ? customers : suppliers)" :key="p.id" :value="p.id">
                {{ p.name }}{{ debtLabel(p) ? '（' + debtLabel(p) + '）' : '' }}
              </option>
            </select>
          </div>
          <div v-if="!orderEdit.party_id">
            <label>{{ orderEdit.kind === 'sales' ? '客户' : '供应商' }}名称（手动）</label>
            <input v-model="orderEdit.name_free" />
          </div>
          <div>
            <label>结算账户</label>
            <select v-model="orderEdit.account_id">
              <option value="">— 未设置 —</option>
              <option v-for="a in accounts" :key="a.id" :value="a.id">{{ a.name }}（{{ money(a.balance) }}）</option>
            </select>
          </div>
          <div>
            <label>单据日期（可选）</label>
            <input type="date" v-model="orderEdit.date" />
          </div>
          <div>
            <label>备注</label>
            <input v-model="orderEdit.note" />
          </div>
        </div>
        <div class="table-wrap">
          <table class="items-edit">
            <thead>
              <tr>
                <th style="min-width:220px">商品</th>
                <th>数量</th>
                <th>{{ orderEdit.kind === 'sales' ? '售价' : '进价' }}</th>
                <th>成本</th>
                <th class="num">小计</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(it, i) in orderEdit.items" :key="i">
                <td>
                  <div v-if="it.manual" style="display:flex; align-items:center; gap:6px">
                    <input v-model="it.name" placeholder="手填项名称（不入库商品/服务）" style="flex:1" />
                    <span class="badge gray" style="flex-shrink:0">手填</span>
                  </div>
                  <product-picker v-else v-model="it.product_id" :products="orderEdit.kind === 'sales' ? activeProducts : purchasableProducts" :mode="orderEdit.kind" @update:model-value="onProductChangeEdit(it, $event)" />
                </td>
                <td><input type="number" min="0" step="any" v-model.number="it.qty" style="width:85px" /></td>
                <td><input type="number" min="0" step="0.01" v-model.number="it.price" style="width:105px" /></td>
                <td>
                  <input v-if="it.manual" type="number" min="0" step="0.01" v-model.number="it.cost" style="width:105px" placeholder="无则0" />
                  <span v-else class="text-muted" style="font-size:12px">{{ money((productMap[it.product_id] || {}).avg_cost || 0) }}</span>
                </td>
                <td class="num">{{ money(it.qty * it.price) }}</td>
                <td><button class="del-row" @click="delRowEdit(i)">×</button></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="form-grid" style="margin:12px 0">
          <div><label>整单优惠</label><input type="number" min="0" step="0.01" v-model.number="orderEdit.discount" /></div>
          <div><label>{{ orderEdit.kind === 'sales' ? '本次收款' : '本次付款' }}</label><input type="number" min="0" step="0.01" v-model.number="orderEdit.paid" /></div>
        </div>
        <div class="total-line">
          <span class="text-muted">合计 {{ money(orderEdit.items.reduce((s, it) => s + Number(it.qty||0)*Number(it.price||0), 0)) }}</span>
          <span class="text-muted">净额 {{ money(Math.max(0, orderEdit.items.reduce((s, it) => s + Number(it.qty||0)*Number(it.price||0), 0) - Number(orderEdit.discount||0))) }}</span>
          <button @click="addRowEdit">＋ 加一行</button>
          <button v-if="orderEdit.kind === 'sales'" @click="orderEdit.items.push({ manual: true, name: '', qty: '', price: '', cost: '', origQty: 0 })">＋ 手填项</button>
          <button @click="orderEdit = null">取消</button>
          <button class="btn-primary" :disabled="submitting" @click="saveOrderEdit">保存修改</button>
        </div>
      </div>
    </div>

    <!-- 打印预览 / 打印纸弹窗 -->
    <div class="modal-mask print-modal-mask" v-if="printDoc" @click.self="printDoc = null">
      <div class="modal print-sheet">
        <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
          <span class="text-muted">打印预览（A4 / 票据打印机自适应）</span>
          <div>
            <button type="button" class="btn-primary" @click="doPrint">立即打印</button>
            <button type="button" @click="closePrint" style="margin-left:8px">关闭</button>
          </div>
        </div>

        <!-- 真正被打印的纸张区域 -->
        <div class="printable">
          <div class="print-header">
            <h2>{{ company.company_name || '企业出库单' }} · {{ printDoc.title }}</h2>
            <div class="print-no" v-if="printDoc.no">{{ printDoc.no }}</div>
          </div>
          <div class="print-meta" v-if="printDoc.meta">
            <div v-for="([k, v], i) in printDoc.meta" :key="i">
              <span class="text-muted">{{ k }}：</span><strong>{{ v }}</strong>
            </div>
          </div>

          <div class="print-remark" v-if="printDoc.remark">
            <div class="remark-title">{{ printDoc.remarkLabel || '备注' }}</div>
            <div class="remark-body">{{ printDoc.remark }}</div>
          </div>

          <table v-if="printDoc.table" class="print-table">
            <thead>
              <tr><th v-for="h in printDoc.table.head" :key="h">{{ h }}</th></tr>
            </thead>
            <tbody>
              <tr v-for="(r, i) in printDoc.table.rows" :key="i">
                <td v-for="(c, j) in r" :key="j" :class="{ 'text-right': j >= r.length - 3 }">{{ c }}</td>
              </tr>
            </tbody>
          </table>

          <div class="print-totals" v-if="printDoc.totals">
            <div v-for="([k, v], i) in printDoc.totals" :key="i">
              <span class="text-muted">{{ k }}：</span><strong style="font-size:15px">{{ v }}</strong>
            </div>
          </div>

          <div class="print-footer">
            <div class="sign-block">
              <span>经手人：_____________</span>
              <span v-if="printDoc.sign" style="margin-left:32px">{{ printDoc.sign }}：_____________</span>
            </div>
            <div class="print-note">{{ company.print_footer_note || '诚信服务 · 品质保证' }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 条码扫码弹窗（手机摄像头实时扫码） -->
    <div class="modal-mask scan-mask" v-if="scanOpen" @click.self="closeScanner">
      <div class="modal" style="max-width:420px">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
          <h3 style="margin:0">📷 条码扫码</h3>
          <button type="button" @click="closeScanner">✕</button>
        </div>
        <p class="text-muted" style="font-size:12.5px; margin-bottom:10px">对准商品条码，识别后自动匹配并填入。<br />提示：手机与条码保持 <strong>10-30 厘米</strong> 距离；画面模糊时点 💡 补光或 ➕ 放大，条码更清楚。</p>
        <div id="scan-region" style="width:100%; height:260px; border-radius:10px; overflow:hidden; background:#0f172a"></div>
        <div style="display:flex; gap:8px; align-items:center; justify-content:center; margin-top:10px">
          <button type="button" class="btn-sm" :disabled="!scanCanTorch" @click="toggleScanTorch" :title="scanCanTorch ? '闪光灯补光' : '设备不支持闪光灯'">💡 {{ scanTorch ? '关灯' : '补光' }}</button>
          <button type="button" class="btn-sm" :disabled="!scanCanZoom" @click="zoomScan(-0.5)" title="镜头缩小">−</button>
          <span class="text-muted" style="font-size:12px; min-width:44px; text-align:center">{{ (scanZoom * 100).toFixed(0) }}%</span>
          <button type="button" class="btn-sm" :disabled="!scanCanZoom" @click="zoomScan(0.5)" title="镜头放大">＋</button>
        </div>
        <div v-if="scanBusy" class="text-muted" style="font-size:12px; margin-top:10px; text-align:center">摄像头启动中…</div>
        <div v-if="scanError" class="text-danger" style="font-size:12.5px; margin-top:10px; text-align:center">{{ scanError }}</div>
      </div>
    </div>

    <!-- 全局提示 -->
    <transition name="toast">
      <div v-if="toastMsg" class="toast" :class="toastType">{{ toastMsg }}</div>
    </transition>
  </script>

  <script src="/vendor/vue.global.prod.js?v=BUILD_VERSION"></script>
  <script src="/vendor/html5-qrcode.min.js?v=BUILD_VERSION"></script>
  <script src="/app.js?v=BUILD_VERSION"></script>
</body>
</html>
